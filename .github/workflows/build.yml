name: Wails build

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: 'v-desktop'
            platform: 'linux/amd64'
            os: 'ubuntu-latest'
            target: 'linux'
          - name: 'v-desktop'
            platform: 'windows/amd64'
            os: 'windows-latest'
            target: 'windows'
          - name: 'v-desktop'
            platform: 'darwin/universal'
            os: 'macos-latest'
            target: 'macos'

    runs-on: ${{ matrix.build.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux deps
        if: matrix.build.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install NSIS
        if: matrix.build.target == 'windows'
        run: choco install nsis

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build (Linux)
        if: matrix.build.target == 'linux'
        run: wails build -platform ${{ matrix.build.platform }} -tags webkit2_41 -o ${{ matrix.build.name }}

      - name: Build (Windows)
        if: matrix.build.target == 'windows'
        run: wails build -platform ${{ matrix.build.platform }} -nsis -o ${{ matrix.build.name }}

      - name: Build (macOS)
        if: matrix.build.target == 'macos'
        run: wails build -platform ${{ matrix.build.platform }} -nopackage -o ${{ matrix.build.name }}

      - name: Stage binaries
        shell: bash
        run: |
          mkdir -p staging
          if [ "${{ matrix.build.target }}" = "windows" ]; then
            cp build/bin/v-desktop staging/v-desktop.exe
            [ -f build/output/v-desktop-installer.exe ] && cp build/output/v-desktop-installer.exe staging/v-desktop-installer.exe || true
            [ -f build/bin/v-desktop-installer.exe ] && cp build/bin/v-desktop-installer.exe staging/v-desktop-installer.exe || true
          else
            cp build/bin/v-desktop staging/
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.build.target }}
          path: staging/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-artifacts
          for dir in artifacts/*/; do
            target=$(basename "$dir")
            for file in "$dir"*; do
              [ -f "$file" ] || continue
              base=$(basename "$file")
              suffix="${base#v-desktop}"
              cp "$file" "release-artifacts/v-desktop-$target$suffix"
            done
          done
          ls -la release-artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          make_latest: true
